[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guardia-agent"
version = "0.1.0"
description = "On-call triage agent: evidence-gathering, cited-hypothesis, human-gated LangGraph agent"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langgraph==1.2.18",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.7",
    "boto3==1.43.121",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "jsonschema==4.26.0",
    "moto[all]==5.2.5",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
